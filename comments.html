<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعليقات المستخدمين - X Plus</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:"Cairo",sans-serif;
background:linear-gradient(145deg,#06101d,#0b1d32,#102844);
color:#fff;
padding:24px 14px;
}

.card{
max-width:720px;
margin:auto;
background:rgba(13,28,47,.94);
border:1px solid rgba(255,255,255,.09);
border-radius:22px;
padding:24px 20px;
box-shadow:0 14px 45px rgba(0,0,0,.22);
}

h1{
margin:0 0 8px;
font-size:24px;
}

.subtitle{
color:#aebdce;
font-size:14px;
line-height:1.8;
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:700;
}

textarea{
width:100%;
min-height:130px;
resize:vertical;
border:1px solid rgba(255,255,255,.10);
border-radius:15px;
background:rgba(255,255,255,.045);
color:#fff;
padding:14px;
font-family:inherit;
font-size:15px;
outline:none;
}

textarea:focus{
border-color:#2563eb;
}

.counter{
text-align:left;
color:#8193a8;
font-size:11px;
margin-top:5px;
}

button{
width:100%;
margin-top:14px;
border:0;
border-radius:13px;
padding:13px;
background:#2563eb;
color:#fff;
font-family:inherit;
font-size:15px;
font-weight:800;
cursor:pointer;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.message{
min-height:25px;
text-align:center;
margin-top:13px;
font-weight:700;
}

.back{
display:block;
text-align:center;
margin-top:18px;
color:#91acd0;
text-decoration:none;
font-size:13px;
}
</style>
</head>

<body>

<section class="card">

<h1>تعليقات المستخدمين</h1>

<div class="subtitle">
اكتب تعليقك مباشرة بدون تقييم أو نجوم.
</div>

<label for="comment">
اكتب تعليقك
</label>

<textarea
id="comment"
maxlength="500"
placeholder="اكتب رأيك أو تجربتك في X Plus..."
></textarea>

<div class="counter">
<span id="count">0</span> / 500
</div>

<button id="submitBtn" type="button">
مشاركة التعليق
</button>

<div class="message" id="message"></div>

<a class="back" href="rating.html">
← العودة إلى صفحة التقييم
</a>

</section>

<script>
const API_URL="/api";

const comment=document.getElementById("comment");
const count=document.getElementById("count");
const submitBtn=document.getElementById("submitBtn");
const message=document.getElementById("message");

function getToken(){
return localStorage.getItem("token") ||
localStorage.getItem("auth_token");
}

function apiFetch(url,options={}){
const token=getToken();

return fetch(url,{
...options,
headers:{
"Content-Type":"application/json",
...(token?{Authorization:`Bearer ${token}`}:{ }),
...(options.headers||{})
}
});
}

comment.addEventListener("input",()=>{
count.textContent=comment.value.length;
});

submitBtn.addEventListener("click",async()=>{

const text=comment.value.trim();

if(!text){
message.textContent="⚠️ اكتب تعليقك أولًا.";
comment.focus();
return;
}

submitBtn.disabled=true;
message.textContent="⏳ جاري نشر التعليق...";

try{

const res=await apiFetch(`${API_URL}/rating`,{
method:"POST",
body:JSON.stringify({
rating:null,
comment:text
})
});

const data=await res.json();

if(!res.ok || !data.success){
throw new Error(
data.message || "فشل نشر التعليق"
);
}

message.textContent="✅ تم نشر تعليقك بنجاح.";

comment.value="";
count.textContent="0";

}catch(error){

console.error(error);

message.textContent=
`❌ ${error.message || "حدث خطأ أثناء النشر"}`;

}finally{

submitBtn.disabled=false;

}

});
</script>

</body>
</html>
