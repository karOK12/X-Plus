<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- X Plus PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b1220">
<link rel="icon" type="image/png" href="/xplus-icon.png">

<title>تقييم التطبيق - X Plus</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:"Cairo",sans-serif;
background:linear-gradient(145deg,#06101d 0%,#0b1d32 55%,#102844 100%);
color:#fff;
padding:24px 14px;
}

.page{
width:100%;
max-width:720px;
margin:auto;
}

.card{
background:rgba(13,28,47,.92);
border:1px solid rgba(255,255,255,.09);
border-radius:22px;
padding:25px 22px;
margin-bottom:16px;
box-shadow:0 14px 45px rgba(0,0,0,.22);
backdrop-filter:blur(10px);
}

.hero{
text-align:center;
padding:28px 22px 24px;
}

.icon{
width:64px;
height:64px;
margin:0 auto 12px;
display:flex;
align-items:center;
justify-content:center;
border-radius:18px;
background:rgba(255,212,59,.10);
font-size:34px;
}

h1{
margin:0 0 8px;
font-size:27px;
font-weight:800;
}

h2{
margin:0 0 5px;
font-size:21px;
font-weight:800;
}

.subtitle{
color:#aebdce;
line-height:1.8;
font-size:14px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
margin-top:22px;
}

.stat{
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.055);
border-radius:14px;
padding:12px 7px;
}

.stat strong{
display:block;
font-size:20px;
font-weight:800;
}

.stat span{
color:#91a3b7;
font-size:11px;
}

.distribution{
margin-top:21px;
text-align:right;
}

.distribution-row{
display:flex;
align-items:center;
gap:8px;
margin:7px 0;
color:#b7c4d2;
font-size:12px;
}

.bar{
flex:1;
height:6px;
background:rgba(255,255,255,.08);
border-radius:20px;
overflow:hidden;
}

.bar-fill{
height:100%;
width:0;
background:#ffd43b;
border-radius:20px;
transition:width .3s;
}

.stars{
display:flex;
justify-content:center;
direction:ltr;
gap:3px;
margin:17px 0 5px;
}

.star{
border:0;
background:transparent;
color:#566578;
font-size:45px;
line-height:1;
cursor:pointer;
padding:3px;
transition:transform .18s,color .18s;
}

.star:hover{
transform:scale(1.08);
}

.star.active{
color:#ffd43b;
}

.rating-text{
text-align:center;
min-height:27px;
color:#ffd43b;
font-size:14px;
font-weight:700;
}

.label{
display:block;
margin:20px 0 8px;
font-size:15px;
font-weight:700;
}

textarea{
width:100%;
min-height:125px;
resize:vertical;
border:1px solid rgba(255,255,255,.10);
border-radius:15px;
background:rgba(255,255,255,.045);
color:#fff;
padding:14px;
font-family:inherit;
font-size:15px;
line-height:1.8;
outline:none;
}

textarea::placeholder{
color:#718399;
}

textarea:focus{
border-color:rgba(37,99,235,.75);
background:rgba(255,255,255,.06);
}

.counter{
text-align:left;
color:#8193a8;
font-size:11px;
margin-top:10px;
}

button.action{
width:100%;
border:0;
border-radius:13px;
padding:13px;
font-family:inherit;
font-size:15px;
font-weight:800;
cursor:pointer;
transition:.18s;
}

.send{
background:#2563eb;
color:#fff;
}

.send:hover{
background:#3472ed;
}

.comment-only{
background:rgba(255,255,255,.055);
border:1px solid rgba(255,255,255,.08)!important;
color:#dbe5ef;
}

.comment-only:hover{
background:rgba(255,255,255,.09);
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.message{
min-height:18px;
text-align:center;
margin-top:13px;
font-size:14px;
font-weight:700;
}

.review{
position:relative;
display:flex;
align-items:flex-start;
gap:12px;
direction:ltr;
padding:0;
margin:0 0 24px;
}

.review:first-child{
padding-top:0;
}

.review-main{
flex:1;
min-width:0;
direction:rtl;
}

.review-user{
display:flex;
align-items:center;
gap:9px;
}

.review-avatar{
width:42px;
height:42px;
border-radius:50%;
object-fit:cover;
flex:none;
background:#172235;
border:1px solid rgba(255,255,255,.08);
}

.review-avatar-fallback{
width:42px;
height:42px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
flex:none;
background:#172235;
color:#9fb0c3;
font-size:19px;
border:1px solid rgba(255,255,255,.08);
}

.review-username{
font-weight:800;
color:#fff;
font-size:14px;
}

.review-meta{
display:flex;
align-items:center;
gap:8px;
margin-top:4px;
}

.review-stars{
direction:ltr;
display:inline-flex;
align-items:center;
gap:1px;
font-size:15px;
line-height:1;
}

.review-stars .filled{
color:#1687ff;
}

.review-stars .empty-star{
color:transparent;
-webkit-text-stroke:1px #111;
}

.review-date{
color:#7f91a6;
font-size:11px;
white-space:nowrap;
}

.review-comment{
margin-top:8px;
padding:0;
border:0;
background:none;
border-radius:0;
color:#d9e3ed;
line-height:1.9;
font-size:13px;
white-space:pre-wrap;
word-break:break-word;
}

.review-actions{
width:52px;
flex:none;
direction:rtl;
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
padding-top:1px;
position:relative;
}

.review-more{
width:34px;
height:30px;
border:0;
background:transparent;
color:#9fb0c3;
font-size:23px;
line-height:1;
cursor:pointer;
padding:0;
}

.review-votes{
display:flex;
align-items:center;
gap:5px;
}

.review-vote{
border:1px solid rgba(255,255,255,.12);
background:transparent;
color:#9fb0c3;
border-radius:8px;
font-size:11px;
padding:4px 7px;
cursor:pointer;
}

.review-vote.active{
color:#fff;
background:rgba(22,135,255,.18);
border-color:rgba(22,135,255,.45);
}

.review-menu{
position:absolute;
left:44px;
top:30px;
z-index:50;
min-width:155px;
background:#111a29;
border:1px solid rgba(255,255,255,.1);
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,.35);
padding:5px;
direction:rtl;
display:none;
}

.review-menu.open{
display:block;
}

.review-report-option{
display:block;
width:100%;
border:0;
background:transparent;
color:#fff;
text-align:right;
padding:9px 10px;
border-radius:7px;
font-size:12px;
cursor:pointer;
}

.review-report-option:hover{
background:rgba(255,255,255,.07);
}

.developer-reply{
margin-top:12px;
padding:0;
direction:rtl;
}

.developer-reply strong{
color:#1687ff;
}

.developer-reply-text{
color:#d8e1ec;
font-size:13px;
line-height:1.8;
white-space:pre-wrap;
word-break:break-word;
}

.developer-reply-date{
margin-top:3px;
font-size:11px;
color:#718096;
}
/* أدوات رد المطوّر في لوحة الإدارة */
.developer-reply-editor{
margin-top:12px;
padding:12px;
border-radius:12px;
background:rgba(11,18,32,.72);
border:1px solid rgba(37,99,235,.25);
}

.developer-reply-editor-title{
font-size:13px;
font-weight:700;
color:#d9e5f2;
margin-bottom:8px;
}

.developer-reply-textarea{
width:100%;
min-height:96px;
resize:vertical;
box-sizing:border-box;
padding:10px 11px;
border-radius:10px;
border:1px solid rgba(255,255,255,.10);
background:#0b1220;
color:#fff;
font-family:inherit;
font-size:13px;
line-height:1.8;
outline:none;
}

.developer-reply-textarea:focus{
border-color:rgba(37,99,235,.65);
}

.developer-reply-textarea::placeholder{
color:#6f8196;
}

.developer-reply-btn{
margin-top:8px;
width:100%;
padding:10px 14px;
border:0;
border-radius:10px;
background:#2563eb;
color:#fff;
font-family:inherit;
font-size:13px;
font-weight:700;
cursor:pointer;
}

.developer-reply-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.developer-reply-status{
margin-top:7px;
font-size:12px;
color:#8fa4bb;
}

.rating-back{display:flex;align-items:center;justify-content:flex-start;width:36px;height:36px;margin:0;position:fixed;top:-14px;right:2px;padding:0;min-height:0;gap:0;color:#91acd0;text-decoration:none;font-size:32px;font-weight:400;line-height:1;transform:scaleY(1.36) translateX(-3px) translateY(2px);}

@media(max-width:560px){
body{padding:14px 10px}
.card{padding:21px 16px;border-radius:19px}
.hero{padding:24px 16px 21px}
h1{font-size:24px}
.stats{grid-template-columns:repeat(3,1fr)}
.stat strong{font-size:18px}
.stat span{font-size:10px}
.star{font-size:40px}
}
.top-rating-star{
font-size:18px !important;
width:18px;
height:18px;
display:inline-flex;
align-items:center;
justify-content:center;
vertical-align:middle;
margin:0 auto;
line-height:1;
color:#ffffff !important;
transition:color .2s;
}
.top-rating-star.active{
color:#2563eb;
}
#reviewStat{position:relative !important;top:-1.5px !important;transform:none !important;margin-top:0 !important;}
</style>
</head>

<script>


const API_URL="/api";

/* ══════════════════════════════════════════════════════
   App Install Counter
   ══════════════════════════════════════════════════════ */

function formatInstallCount(value){
  const count = Number(value) || 0;

  if(count < 1000000){
    return String(count);
  }

  return `+${Math.floor(count / 1000000)} مليون`;
}

async function loadInstallCount(){
  try{
    const res = await apiFetch(`${API_URL}/install/count`);
    const data = await res.json();

    if(res.ok && data.success){
      const downloadCount =
        document.getElementById("downloadCount");

      if(downloadCount){
        downloadCount.textContent =
          formatInstallCount(data.count);
      }
    }
  }catch(error){
    console.error("❌ تعذر تحميل عدد التثبيتات:", error);
  }
}

/*
  تحميل العدد الحالي عند فتح الصفحة.
*/
loadInstallCount();

let selectedRating=null;
let isDeveloper=false;

const stars=document.querySelectorAll(".star");
const ratingText=document.getElementById("ratingText");
const comment=document.getElementById("comment");
const charCount=document.getElementById("charCount");
const sendBtn=document.getElementById("sendBtn");
const commentOnlyBtn=document.getElementById("commentOnlyBtn");

const commentOnlyArea=document.getElementById("commentOnlyArea");
const commentOnly=document.getElementById("commentOnly");
const commentOnlyCount=document.getElementById("commentOnlyCount");
const submitCommentOnly=document.getElementById("submitCommentOnly");
const message=document.getElementById("message");
const reviews=document.getElementById("reviews");
const commentArea=document.getElementById("commentArea");
const topRatingStar=document.querySelector(".top-rating-star");
const reviewStat=document.getElementById("reviewStat");
const shareRatingBtn=document.getElementById("shareRatingBtn");

shareRatingBtn.addEventListener("click",()=>{
if(!selectedRating){
message.textContent="⚠️ اختر عدد النجوم أولاً.";
return;
}
window.location.href=`reviews.html?rating=${selectedRating}`;
});

function resetRatingSelection(){

stars.forEach(star=>{
star.classList.remove("active");
});

selectedRating=null;

if(topRatingStar){
topRatingStar.classList.remove("active");
}

ratingText.textContent=
"اختر عدد النجوم لتقييم X Plus";

commentArea.style.display="none";

comment.value="";
charCount.textContent="0";

message.textContent="";

}

if(reviewStat){
reviewStat.addEventListener("click",()=>{
window.location.href="reviews.html";
});

reviewStat.addEventListener("keydown",(event)=>{
if(event.key==="Enter" || event.key===" "){
event.preventDefault();
window.location.href="reviews.html";
}
});
}


function getToken(){
return localStorage.getItem("token") ||
localStorage.getItem("auth_token");
}

function apiFetch(url,options={}){
const token=getToken();

return fetch(url,{
...options,
headers:{
"Content-Type":"application/json",
...(token?{Authorization:`Bearer ${token}`}:{ }),
...(options.headers||{})
}
});
}

function showStars(value){

stars.forEach(star=>{
star.classList.remove("active");
});

if(value!==null){

const star=document.querySelector(
`.star[data-rating="${value}"]`
);

if(star){
star.classList.add("active");
}

}

}

stars.forEach(star=>{

star.addEventListener("click",()=>{

const clickedRating=Number(star.dataset.rating);

if(star.classList.contains("active")){

star.classList.remove("active");

selectedRating=null;

stars.forEach(otherStar=>{

if(otherStar.classList.contains("active")){
selectedRating=Number(otherStar.dataset.rating);
}

});

if(selectedRating===null){

resetRatingSelection();

}else{

ratingText.textContent=
`${selectedRating} من 5 ⭐`;

}

return;

}

star.classList.add("active");

selectedRating=clickedRating;

const topRatingStar=document.querySelector(".top-rating-star");

if(topRatingStar){
topRatingStar.classList.add("active");
}

ratingText.textContent=
`${selectedRating} من 5 ⭐`;

commentOnlyArea.style.display="none";
commentOnly.value="";
commentOnlyCount.textContent="0";

commentArea.style.display="block";

message.textContent="";

});

});

comment.addEventListener("input",()=>{
charCount.textContent=comment.value.length;
});

function formatDate(value){

if(!value)return "";

try{

return new Date(value).toLocaleDateString(
"ar-IQ",
{
year:"numeric",
month:"long",
day:"numeric"
}
);

}catch{
return "";
}

}

function renderStars(rating){

if(!rating)return "";

return "★".repeat(Number(rating))+
"☆".repeat(5-Number(rating));
}

function updateStats(stats){

if(!stats)return;

const averageRating=Number(stats.averageRating||0);
const totalRatings=Number(stats.totalRatings||0);
const totalReviews=Number(stats.totalReviews||0);

const averageElement=document.getElementById("averageRating");

if(averageElement){
averageElement.textContent=
averageRating.toFixed(1);
}

const totalRatingsElement=document.getElementById("totalRatings");

if(totalRatingsElement){
totalRatingsElement.textContent=
totalRatings;
}

const totalReviewsElement=document.getElementById("totalReviews");

if(totalReviewsElement){
totalReviewsElement.textContent=
totalReviews;
}

const total=totalRatings;

for(let i=1;i<=5;i++){

const count=Number(stats.distribution?.[i]||0);

const countElement=document.getElementById(`count${i}`);

if(countElement){
countElement.textContent=count;
}

const barElement=document.getElementById(`bar${i}`);

if(barElement){
const percentage=total>0?(count/total)*100:0;
barElement.style.width=`${percentage}%`;
}

}

}

async function loadComments(){

const commentsContainer=document.getElementById("comments");

if(!commentsContainer)return;

try{

const res=await apiFetch(`${API_URL}/rating`);

const data=await res.json();

if(!res.ok||!data.success){

throw new Error(
data.message||"تعذر تحميل التعليقات"
);

}

const items=Array.isArray(data.reviews)
?data.reviews
:[];

if(!items.length){

commentsContainer.innerHTML=
`<div class="empty">لا توجد تعليقات بعد. كن أول من يشارك رأيه.</div>`;

return;

}

const formatCommentDate=(value)=>{

if(!value)return "";

const d=new Date(value);

if(Number.isNaN(d.getTime()))return "";

return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;

};

const renderStars=(rating)=>{

const n=Math.max(
0,
Math.min(5,Number(rating)||0)
);

return `
<span class="review-stars">
${Array.from(
{length:5},
(_,i)=>
`<span class="${i<n?"filled":"empty-star"}">${i<n?"★":"☆"}</span>`
).join("")}
</span>
`;

};

const renderAvatar=(item)=>{

const avatar=String(
item.profileImage||
item.profile_image||
""
).trim();

if(avatar){

return `
<img
class="review-avatar"
src="${escapeHtml(avatar)}"
alt=""
loading="lazy"
onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
>
<div
class="review-avatar-fallback"
style="display:none;"
>
👤
</div>
`;

}

return `
<div class="review-avatar-fallback">
👤
</div>
`;

};

commentsContainer.innerHTML=`

${items.map((item,index)=>{

const id=String(item.id||index);

const username=
String(item.username||"مستخدم");

const date=
formatCommentDate(
item.createdAt||
item.created_at
);

const text=
String(item.comment||"").trim();

const reply=
String(
item.developerReply||
item.developer_reply||
""
).trim();

const replyDate=
formatCommentDate(
item.developerReplyAt||
item.developer_reply_at
);

return `
<article
class="review"
data-review-id="${escapeHtml(id)}"
>

<div class="review-actions">

<button
type="button"
class="review-more"
data-review-more="${escapeHtml(id)}"
aria-label="خيارات التعليق"
>⋮</button>

<div class="review-votes">

<button
type="button"
class="review-vote"
data-vote="no"
>لا</button>

<button
type="button"
class="review-vote"
data-vote="yes"
>نعم</button>

</div>

<div
class="review-menu"
data-review-menu="${escapeHtml(id)}"
>

<button
type="button"
class="review-report-option"
data-report-reason="محتوى غير ملائم"
>
محتوى غير ملائم
</button>

<button
type="button"
class="review-report-option"
data-report-reason="غير مرغوب فيه"
>
غير مرغوب فيه
</button>

</div>

</div>

<div class="review-main">

<div class="review-user">

${renderAvatar(item)}

<div class="review-username">
${escapeHtml(username)}
</div>

</div>

<div class="review-meta">

${renderStars(item.rating)}

<span class="review-date">
${escapeHtml(date)}
</span>

</div>

<div class="review-comment">
${escapeHtml(text)}
</div>

${reply?`

<div class="developer-reply">

<strong>رد المطوّر</strong>

<div class="developer-reply-text">
${escapeHtml(reply)}
</div>

${replyDate?`
<div class="developer-reply-date">
${escapeHtml(replyDate)}
</div>
`:""}

</div>

`:""}

</div>

</article>
`;

}).join("")}

`;

commentsContainer
.querySelectorAll("[data-review-more]")
.forEach(button=>{

button.addEventListener("click",(event)=>{

event.stopPropagation();

const id=
button.getAttribute("data-review-more");

const menu=
commentsContainer.querySelector(
`[data-review-menu="${CSS.escape(id)}"]`
);

commentsContainer
.querySelectorAll(".review-menu.open")
.forEach(other=>{

if(other!==menu){
other.classList.remove("open");
}

});

if(menu){
menu.classList.toggle("open");
}

});

});

commentsContainer
.querySelectorAll(".review-report-option")
.forEach(option=>{

option.addEventListener("click",()=>{

const reason=
option.getAttribute("data-report-reason")||"";

const review=
option.closest(".review");

if(review){
review.dataset.reportReason=reason;
}

option.closest(".review-menu")
?.classList.remove("open");

});

});

commentsContainer
.querySelectorAll(".review-vote")
.forEach(button=>{

button.addEventListener("click",()=>{

const review=
button.closest(".review");

if(!review)return;

review
.querySelectorAll(".review-vote")
.forEach(vote=>{
vote.classList.remove("active");
});

button.classList.add("active");

});

});

}catch(error){

console.error(
"❌ COMMENTS ERROR:",
error
);

commentsContainer.innerHTML=
`<div class="empty">تعذر تحميل التعليقات حاليًا.</div>`;

}

}
function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

async function loadRating(){

if(!getToken()){

window.location.href="login.html";

return;

}

try{

const res=await apiFetch(`${API_URL}/rating`);

const data=await res.json();

if(!res.ok||!data.success){

throw new Error(
data.message||"تعذر تحميل التقييمات"
);

}

if(data.rating){

selectedRating=null;

showStars(null);

if(topRatingStar){
topRatingStar.classList.remove("active");
}

ratingText.textContent=
"اختر عدد النجوم لتقييم X Plus";

}

if(data.comment){

comment.value=data.comment;

charCount.textContent=
data.comment.length;

}

updateStats(data.stats);

}catch(err){

console.error("❌ RATING LOAD ERROR:",err);

}

}

async function submitParticipation(ratingValue){

const text=comment.value.trim();

if(!ratingValue&&!text){

message.textContent=
"⚠️ اختر تقييمًا أو اكتب تعليقًا أولًا.";

return;

}

if(text.length>500){

message.textContent=
"⚠️ التعليق يجب ألا يتجاوز 500 حرف.";

return;

}

sendBtn.disabled=true;
commentOnlyBtn.disabled=true;

message.textContent=
"⏳ جاري إرسال مشاركتك...";

try{

const res=await apiFetch(`${API_URL}/rating`,{

method:"POST",

body:JSON.stringify({

rating:ratingValue,
comment:text||null

})

});

const data=await res.json();

if(!res.ok||!data.success){

throw new Error(
data.message||"فشل نشر المراجعة"
);

}

message.textContent=
"✅ تم حفظ مشاركتك بنجاح.";

if(topRatingStar){
topRatingStar.classList.add("active");
}

await loadRating();

}catch(err){

console.error(err);

message.textContent=
`❌ ${err.message||"حدث خطأ أثناء الحفظ"}`;

}finally{

sendBtn.disabled=false;
commentOnlyBtn.disabled=false;

}

}

sendBtn.addEventListener("click",()=>{
submitParticipation(selectedRating);
});

commentOnlyBtn.addEventListener("click",()=>{

commentArea.style.display="none";

comment.value="";
charCount.textContent="0";

showStars(null);

selectedRating=null;

ratingText.textContent="تعليق بدون تقييم";

commentOnlyArea.style.display="block";

commentOnly.focus();

message.textContent="";

});

commentOnly.addEventListener("input",()=>{
commentOnlyCount.textContent=
commentOnly.value.length;
});

submitCommentOnly.addEventListener("click",async()=>{

const text=commentOnly.value.trim();

if(!text){

message.textContent=
"⚠️ اكتب تعليقك أولًا.";

commentOnly.focus();

return;

}

submitCommentOnly.disabled=true;

message.textContent=
"⏳ جاري نشر التعليق...";

try{

const res=await apiFetch(`${API_URL}/rating/comments`,{

method:"POST",

body:JSON.stringify({
comment:text
})

});

const data=await res.json();

if(!res.ok||!data.success){

throw new Error(
data.message||"فشل نشر التعليق"
);

}

message.textContent=
"✅ تم نشر تعليقك بنجاح.";

commentOnly.value="";
commentOnlyCount.textContent="0";

commentOnlyArea.style.display="none";

await loadComments();

}catch(err){

console.error(err);

message.textContent=
`❌ ${err.message||"حدث خطأ أثناء النشر"}`;

}finally{

submitCommentOnly.disabled=false;

}

});

loadRating();
loadComments();

</script>
