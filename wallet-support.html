<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المساعدة والدعم | X Plus</title>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Changa:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0B0E11;
      --card:#1E2329;
      --line:#2B3139;
      --text:#EAECEF;
      --muted:#848E9C;
      --yellow:#FCD535;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:'Almarai',sans-serif;
    }
    header {
      display:flex;
      align-items:center;
      gap:14px;
      padding:18px 16px;
      border-bottom:1px solid var(--line);
      background:#181A20;
    }
    .back {
      width:42px;
      height:42px;
      flex:0 0 42px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:10px;
      background:var(--yellow);
      color:#181A20;
      font-size:22px;
      font-weight:800;
      cursor:pointer;
      transition:.2s;
      box-shadow:0 5px 14px rgba(252,213,53,.25);
    }
    .back:hover {
      background:var(--yellow2);
      transform:translateY(-2px);
      box-shadow:0 6px 16px rgba(252,213,53,.35);
    }
    .back:active {
      transform:scale(.96);
    }
    h1 {
      margin:0;
      font-family:'Changa',sans-serif;
      font-size:19px;
      font-weight:700;
    }
    main {
      width:min(100% - 28px,650px);
      margin:22px auto;
    }
    .card {
      padding:20px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--card);
      min-height:150px;
    }
    .heading {
      margin:0 0 10px;
      color:var(--yellow);
      font-family:'Changa',sans-serif;
      font-size:18px;
    }
    p {
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.9;
    }
  </style>
</head>
<body>
  <header>
    <button class="back" type="button" aria-label="رجوع"
      onclick="walletGoBack()">←</button>
    <h1>المساعدة والدعم</h1>
  </header>
  <main>
    <section class="card">
      <h2 class="heading">المساعدة والدعم</h2>
      <p>معلومات المساعدة والتواصل والدعم.</p>
      <p style="margin-top:14px">سيتم إضافة محتوى هذا القسم لاحقاً.</p>
    </section>
  </main>

<script>
function walletGoBack() {
  location.replace('/wallet.html?view=account');
}
</script>

</body>
</html>
