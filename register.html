<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيانات المستخدم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
  body {
    background: #e9eef5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 10px 20px;
  }
  .container {
    background: #fff;
    padding: 14px;
    border-radius: 14px;
    max-width: 500px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #1a2b4a;
    font-size: 20px;
  }
  .profile-pic {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: #ddd;
    margin: 0 auto 14px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .profile-pic:hover { transform: scale(1.05); }
  .profile-pic img { width: 100%; height: 100%; object-fit: cover; }
  .profile-pic .placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: #999; font-size: 30px;
  }
  .add-icon {
    position: absolute;
    bottom: 4px; right: 4px;
    background: #1877f2;
    color: #fff;
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(24,119,242,0.4);
  }
  .field { margin-bottom: 6px; }
  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  .row > * { flex: 1; min-width: 0; }
  input, select {
    width: 100%;
    padding: 6px 9px;
    border-radius: 7px;
    border: 1px solid #ccc;
    font-size: 13px;
    outline: none;
    background: #fff;
    font-family: 'Cairo', sans-serif;
    color: #333;
  }
  input:focus, select:focus { border-color: #1877f2; }
  input::placeholder { color: #999; }
  input[readonly] { background: #f5f5f5; }
  select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: left 8px center;
    background-size: 14px;
    padding-left: 28px;
  }
  .birth-label {
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
    font-weight: 600;
  }
  button {
    background: #1877f2;
    color: #fff;
    padding: 8px 10px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Cairo', sans-serif;
    width: 100%;
  }
  button:hover:not(:disabled) { background: #166fe0; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary { background: #6c757d; }
  button.success { background: #28a745; }
  .btn-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .btn-row > * { flex: 1; }
  .hidden-fields { display: none; }
  .hidden-fields.show { display: block; }
  .otp-section {
    background: #f8f9fa;
    border: 1px solid #e0e6ed;
    border-radius: 10px;
    padding: 12px;
    margin: 12px 0;
  }
  .otp-section h3 {
    font-size: 14px;
    color: #1a2b4a;
    margin-bottom: 8px;
    text-align: center;
  }
  .otp-email {
    background: #e3f2fd;
    color: #1565c0;
    padding: 8px;
    border-radius: 6px;
    font-size: 12px;
    text-align: center;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .otp-inputs {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 10px 0;
  }
  .otp-inputs input {
    width: 40px;
    height: 45px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    padding: 0;
  }
  .alert {
    padding: 10px 12px;
    border-radius: 7px;
    font-size: 12px;
    margin-bottom: 10px;
    display: none;
  }
  .alert.show { display: block; }
  .alert.error { background: #fee; color: #c33; border: 1px solid #fcc; }
  .alert.success { background: #efe; color: #3c3; border: 1px solid #cfc; }
  .alert.info { background: #eef; color: #36c; border: 1px solid #ccf; }
  .error-msg {
    font-size: 11px;
    color: #e74c3c;
    margin-top: 2px;
    display: none;
  }
  .error-msg.show { display: block; }
  .divider {
    height: 1px;
    background: #e0e6ed;
    margin: 14px 0;
  }
  .loading {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #fff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 6px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <h2>📝 بيانات المستخدم</h2>
  
  <div class="alert" id="alert"></div>
  
  <div class="profile-pic" onclick="uploadProfilePic()">
    <div class="placeholder" id="profilePlaceholder">👤</div>
    <img id="profileImg" style="display:none" alt="profile">
    <div class="add-icon">+</div>
  </div>
  <input id="profileInput" type="file" accept="image/*" capture style="display:none">
  
  <div class="field">
    <input id="fullName" placeholder="الاسم الكامل">
    <div class="error-msg" id="err-fullName">الاسم الكامل مطلوب</div>
  </div>
  
  <div class="field">
    <input id="lastName" placeholder="اللقب">
    <div class="error-msg" id="err-lastName">اللقب مطلوب</div>
  </div>
  
  <div class="birth-label">📅 تاريخ الميلاد</div>
  <div class="row">
    <select id="birthDay"><option value="">اليوم</option></select>
    <select id="birthMonth">
      <option value="">الشهر</option>
      <option value="1">يناير</option>
      <option value="2">فبراير</option>
      <option value="3">مارس</option>
      <option value="4">أبريل</option>
      <option value="5">مايو</option>
      <option value="6">يونيو</option>
      <option value="7">يوليو</option>
      <option value="8">أغسطس</option>
      <option value="9">سبتمبر</option>
      <option value="10">أكتوبر</option>
      <option value="11">نوفمبر</option>
      <option value="12">ديسمبر</option>
    </select>
    <select id="birthYear"><option value="">السنة</option></select>
  </div>
  
  <div class="row">
    <select id="country" style="flex: 0 0 35%">
      <option value="">الدولة</option>
      <option value="+964">العراق</option>
      <option value="+20">مصر</option>
      <option value="+966">السعودية</option>
      <option value="+971">الإمارات</option>
      <option value="+965">الكويت</option>
      <option value="+974">قطر</option>
      <option value="+961">لبنان</option>
      <option value="+962">الأردن</option>
    </select>
    <input id="phone" placeholder="رقم الهاتف" type="tel">
  </div>
  
  <div class="row">
    <input id="city" placeholder="المدينة">
    <input id="state" placeholder="المحافظة">
  </div>
  
  <div class="field">
    <select id="idType">
      <option value="">نوع الهوية (اختياري)</option>
      <option value="national">بطاقة وطنية</option>
      <option value="passport">جواز سفر</option>
      <option value="license">رخصة قيادة</option>
    </select>
  </div>
  
  <div class="hidden-fields" id="idFields">
    <div class="field"><input id="idName" placeholder="اسم صاحب الهوية"></div>
    <div class="field"><input id="idNumber" placeholder="رقم الهوية"></div>
  </div>
  
  <div class="row">
    <input id="imageLink" readonly placeholder="صورة الهوية (اختياري)">
    <button type="button" onclick="document.getElementById('fileInput').click()" style="flex: 0 0 30%">رفع</button>
    <input id="fileInput" type="file" accept="image/*" capture style="display:none">
  </div>
  
  <div class="divider"></div>
  
  <div class="field">
    <button id="otpBtn" onclick="sendOTP()">📧 إرسال كود التحقق للبريد</button>
  </div>
  
  <div class="otp-section" id="otpSection" style="display:none">
    <h3>🔐 أدخل الرمز المُرسل إلى بريدك</h3>
    <div class="otp-email" id="otpEmail">—</div>
    <div class="otp-inputs">
      <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
    </div>
    <div class="btn-row">
      <button id="verifyOtpBtn" onclick="verifyOTP()" class="success">تأكيد الرمز</button>
      <button onclick="sendOTP()" id="resendBtn" class="secondary">إعادة الإرسال</button>
    </div>
  </div>
  
  <div class="divider"></div>
  <div class="field">
    <button id="saveBtn" onclick="saveData()" class="success" disabled>💾 حفظ البيانات</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// 🔗 إعدادات API
// ══════════════════════════════════════════════════════════
const API_URL = window.location.hostname === 'localhost'
  ? 'http://localhost:3000/api'
  : '/api';

// ══════════════════════════════════════════════════════════
// 🌐 دالة fetch محمية - ترسل التوكن تلقائياً
// ══════════════════════════════════════════════════════════
async function apiFetch(url, options = {}) {
  const token = localStorage.getItem('token') || localStorage.getItem('auth_token');
  
  if (!token) {
    throw new Error('يجب تسجيل الدخول أولاً');
  }
  
  const headers = {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${token}`,
    ...(options.headers || {})
  };
  
  const response = await fetch(url, { ...options, headers });
  
  if (response.status === 401) {
    localStorage.removeItem('token');
    localStorage.removeItem('auth_token');
    alert('انتهت صلاحية الجلسة - سيتم تحويلك لتسجيل الدخول');
    window.location.href = '/login.html';
    throw new Error('انتهت الجلسة');
  }
  
  const data = await response.json();
  
  if (!response.ok || !data.success) {
    throw new Error(data.message || `خطأ ${response.status}`);
  }
  
  return data;
}

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
const state = {
  form: {},
  userEmail: '',
  otpVerified: false,
  cooldown: 0
};

// ══════════════════════════════════════════════════════════
// 📅 تحميل بيانات المستخدم من السيرفر
// ══════════════════════════════════════════════════════════
async function loadUserData() {
  try {
    const data = await apiFetch(`${API_URL}/user/profile`);
    const u = data.user;
    
    state.userEmail = u.email;
    state.form = {
      fullName: u.full_name || '',
      lastName: u.last_name || '',
      phone: u.phone || '',
      city: u.city || '',
      state: u.state || '',
      idType: u.id_type || '',
      idName: u.id_name || '',
      idNumber: u.id_number || '',
      imageLink: u.id_image || '',
      profileImage: u.profile_image || ''
    };
    
    // تاريخ الميلاد
    if (u.birth_date) {
      const parts = u.birth_date.split('T')[0].split('-');
      if (parts.length === 3) {
        state.form.birthYear = parts[0];
        state.form.birthMonth = String(parseInt(parts[1]));
        state.form.birthDay = String(parseInt(parts[2]));
      }
    }
    
    // تعبئة الحقول
    Object.keys(state.form).forEach(key => {
      const el = document.getElementById(key);
      if (el) el.value = state.form[key] || '';
    });
    
    if (state.form.idType) {
      document.getElementById('idFields').classList.add('show');
    }
    
    if (state.form.profileImage) {
      document.getElementById('profileImg').src = state.form.profileImage;
      document.getElementById('profileImg').style.display = 'block';
      document.getElementById('profilePlaceholder').style.display = 'none';
    }
    
    showAlert('✓ تم تحميل بياناتك', 'success');
    
  } catch (err) {
    console.error('Load error:', err);
    showAlert('تعذر تحميل البيانات: ' + err.message, 'error');
  }
}

// ══════════════════════════════════════════════════════════
// 📅 ملء قوائم التاريخ
// ══════════════════════════════════════════════════════════
function populateDates() {
  const daySelect = document.getElementById('birthDay');
  const yearSelect = document.getElementById('birthYear');
  
  for (let i = 1; i <= 31; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i;
    daySelect.appendChild(opt);
  }
  
  for (let i = 2010; i >= 1940; i--) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i;
    yearSelect.appendChild(opt);
  }
}

populateDates();

// ══════════════════════════════════════════════════════════
// 📝 ربط الحقول بالحالة
// ══════════════════════════════════════════════════════════
['fullName','lastName','phone','city','state','idName','idNumber']
  .forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', e => {
        state.form[id] = e.target.value;
        clearError(id);
      });
    }
  });

['birthDay','birthMonth','birthYear'].forEach(id => {
  document.getElementById(id).addEventListener('change', e => {
    state.form[id] = e.target.value;
  });
});

document.getElementById('idType').addEventListener('change', e => {
  state.form.idType = e.target.value;
  document.getElementById('idFields').classList.toggle('show', !!e.target.value);
});

// ══════════════════════════════════════════════════════════
// 📸 رفع الصور
// ══════════════════════════════════════════════════════════
function uploadProfilePic() {
  document.getElementById('profileInput').click();
}

document.getElementById('profileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    showAlert('الصورة كبيرة جداً (حد أقصى 5MB)', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    state.form.profileImage = reader.result;
    document.getElementById('profileImg').src = reader.result;
    document.getElementById('profileImg').style.display = 'block';
    document.getElementById('profilePlaceholder').style.display = 'none';
    showAlert('✓ تم رفع الصورة', 'success');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) {
    showAlert('الصورة كبيرة جداً (حد أقصى 10MB)', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    state.form.imageLink = reader.result;
    document.getElementById('imageLink').value = '✓ تم الرفع';
    showAlert('✓ تم رفع صورة الهوية', 'success');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

// ══════════════════════════════════════════════════════════
// 🔢 مدخلات OTP
// ══════════════════════════════════════════════════════════
const otpBoxes = document.querySelectorAll('.otp-box');
otpBoxes.forEach((box, idx) => {
  box.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    if (e.target.value && idx < otpBoxes.length - 1) {
      otpBoxes[idx + 1].focus();
    }
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !e.target.value && idx > 0) {
      otpBoxes[idx - 1].focus();
    }
  });
  box.addEventListener('paste', e => {
    e.preventDefault();
    const paste = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '');
    paste.split('').forEach((c, i) => {
      if (otpBoxes[idx + i]) otpBoxes[idx + i].value = c;
    });
  });
});

function getOTP() {
  return Array.from(otpBoxes).map(b => b.value).join('');
}

function clearOTP() {
  otpBoxes.forEach(b => b.value = '');
  otpBoxes[0].focus();
}

// ══════════════════════════════════════════════════════════
// 📧 إرسال OTP إلى بريد المستخدم (الحقيقي)
// ══════════════════════════════════════════════════════════
async function sendOTP() {
  if (state.cooldown > 0) return;
  
  if (!state.form.fullName || !state.form.lastName) {
    showAlert('⚠️ أكمل الاسم واللقب أولاً', 'error');
    return;
  }
  
  const btn = document.getElementById('otpBtn');
  const resendBtn = document.getElementById('resendBtn');
  btn.disabled = true;
  resendBtn.disabled = true;
  btn.innerHTML = 'جاري الإرسال <span class="loading"></span>';
  
  try {
    // 🎯 استدعاء السيرفر الحقيقي - سيرسل الكود للبريد
    const data = await apiFetch(`${API_URL}/otp/send-data`, {
      method: 'POST'
    });
    
    showAlert('✓ ' + data.message, 'success');
    document.getElementById('otpEmail').textContent = '📧 ' + state.userEmail;
    document.getElementById('otpSection').style.display = 'block';
    document.getElementById('otpSection').scrollIntoView({ behavior: 'smooth', block: 'center' });
    clearOTP();
    startCooldown(45);
    
  } catch (err) {
    showAlert('✗ ' + err.message, 'error');
    console.error('OTP Send Error:', err);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '📧 إرسال كود التحقق للبريد';
  }
}

function startCooldown(sec) {
  state.cooldown = sec;
  const btn = document.getElementById('resendBtn');
  const timer = setInterval(() => {
    state.cooldown--;
    btn.disabled = true;
    btn.textContent = `إعادة الإرسال (${state.cooldown}s)`;
    if (state.cooldown <= 0) {
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = 'إعادة الإرسال';
    }
  }, 1000);
}

// ══════════════════════════════════════════════════════════
// ✅ التحقق من OTP
// ══════════════════════════════════════════════════════════
async function verifyOTP() {
  const code = getOTP();
  
  if (code.length !== 6) {
    showAlert('⚠️ أدخل الرمز كاملاً (6 أرقام)', 'error');
    return;
  }
  
  const btn = document.getElementById('verifyOtpBtn');
  btn.disabled = true;
  btn.innerHTML = 'جاري التحقق <span class="loading"></span>';
  
  try {
    // 🎯 السيرفر يتحقق باستخدام bcrypt compare
    await apiFetch(`${API_URL}/otp/verify-data`, {
      method: 'POST',
      body: JSON.stringify({ otp: code })
    });
    
    state.otpVerified = true;
    showAlert('✓ تم التحقق بنجاح!', 'success');
    
    document.getElementById('otpSection').style.background = '#e8f5e9';
    document.getElementById('otpSection').style.borderColor = '#4caf50';
    btn.innerHTML = '✓ تم التحقق';
    btn.style.background = '#4caf50';
    
    // تفعيل زر الحفظ
    document.getElementById('saveBtn').disabled = false;
    
  } catch (err) {
    showAlert('✗ ' + err.message, 'error');
    clearOTP();
  } finally {
    if (!state.otpVerified) {
      btn.disabled = false;
      btn.innerHTML = 'تأكيد الرمز';
    }
  }
}

// ══════════════════════════════════════════════════════════
// 💾 حفظ البيانات في السيرفر
// ══════════════════════════════════════════════════════════
async function saveData() {
  if (!state.otpVerified) {
    showAlert('⚠️ يجب إكمال التحقق أولاً', 'error');
    return;
  }
  
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.innerHTML = 'جاري الحفظ <span class="loading"></span>';
  
  try {
    const birthDate = (state.form.birthYear && state.form.birthMonth && state.form.birthDay)
      ? `${state.form.birthYear}-${String(state.form.birthMonth).padStart(2,'0')}-${String(state.form.birthDay).padStart(2,'0')}`
      : null;
    
    await apiFetch(`${API_URL}/user/profile`, {
      method: 'PUT',
      body: JSON.stringify({
        fullName: state.form.fullName,
        lastName: state.form.lastName,
        birthDate,
        country: document.getElementById('country').value,
        phone: state.form.phone,
        city: state.form.city,
        state: state.form.state,
        idType: state.form.idType,
        idName: state.form.idName,
        idNumber: state.form.idNumber,
        idImage: state.form.imageLink || null,
        profileImage: state.form.profileImage || null
      })
    });
    
    showAlert('✓ تم حفظ البيانات بنجاح!', 'success');
    
    setTimeout(() => {
      if (window.opener) {
        window.close();
      } else {
        window.location.href = '/index.html';
      }
    }, 1500);
    
  } catch (err) {
    showAlert('✗ فشل الحفظ: ' + err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '💾 حفظ البيانات';
  }
}

// ══════════════════════════════════════════════════════════
// 🔔 Helpers
// ══════════════════════════════════════════════════════════
function showAlert(msg, type = 'info') {
  const alert = document.getElementById('alert');
  alert.textContent = msg;
  alert.className = 'alert show ' + type;
  setTimeout(() => alert.classList.remove('show'), 5000);
}

function showError(id) {
  const el = document.getElementById('err-' + id);
  if (el) el.classList.add('show');
}

function clearError(id) {
  const el = document.getElementById('err-' + id);
  if (el) el.classList.remove('show');
}

// ══════════════════════════════════════════════════════════
// 🚀 بدء التشغيل
// ══════════════════════════════════════════════════════════
loadUserData();
</script>
