<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .container {
            width: 90%;
            max-width: 400px;
            background: #111827;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            color: white;
        }
        
        .logo-box {
            margin-bottom: 15px;
        }
        
        .logo-box img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: none;
            background: #1f2937;
            color: white;
            font-size: 16px;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .link {
            font-size: 12px;
            color: #60a5fa;
            cursor: pointer;
            margin-bottom: 10px;
            display: block;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        button.main-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        button.main-btn:hover {
            background: #1d4ed8;
        }
        
        .social {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        
        .social-btn {
            flex: 1;
            margin: 0 3px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        
        .social-btn:hover {
            opacity: 0.9;
        }
        
        .error-msg {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
<div class="logo-box">
    <img src="https://d.top4top.io/p_3867p7o0f1.png" alt="شعار X Plus">
</div>

        <!-- Inputs -->
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">

        <!-- Links -->
        <p class="link" onclick="forgotPassword()">نسيت كلمة المرور؟</p>

        <!-- Button -->
        <button class="main-btn" onclick="login()">تسجيل الدخول</button>

        <!-- Register -->
        <p class="link" onclick="register()">إنشاء حساب جديد</p>

        <!-- Social -->
        <div class="social">
            <button class="social-btn" style="background: #db4437;" onclick="socialLogin('google')">Google</button>
            <button class="social-btn" style="background: #1877f2;" onclick="socialLogin('facebook')">Facebook</button>
            <button class="social-btn" style="background: #22c55e;" onclick="phoneVerification()">Phone</button>
        </div>

        <p class="error-msg" id="errorMsg"></p>
    </div>

  <script>
async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.textContent = "";

    if (!email || !password) {
        errorMsg.textContent = "يرجى ملء الحقول";
        return;
    }

    try {

        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email,
                password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            errorMsg.textContent = data.message || "فشل تسجيل الدخول";
            return;
        }

        if (!localStorage.getItem("token")) {
    localStorage.setItem("token", data.token);
}

window.location.href = "/";

    } catch (error) {

        console.error(error);
        errorMsg.textContent = "تعذر الاتصال بالخادم";

    }

}

function forgotPassword() {
    window.location.href = "/forgot-password";
}

function register() {
    window.location.href = "/register.html";
}

function socialLogin(provider) {
    window.location.href = "/" + provider + "-login";
}

function phoneVerification() {
    window.location.href = "/phone";
}
</script>
</body>
</html>
