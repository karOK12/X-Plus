<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .container {
            width: 90%;
            max-width: 400px;
            background: #111827;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            color: white;
        }
        
        .logo-box {
            margin-bottom: 15px;
        }
        
        .logo-box img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .welcome-text {
            display: none;
            margin-top: -5px;
            margin-bottom: 15px;
            color: #60a5fa;
            font-size: 15px;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: none;
            background: #1f2937;
            color: white;
            font-size: 16px;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .link {
            font-size: 12px;
            color: #60a5fa;
            cursor: pointer;
            margin-bottom: 10px;
            display: block;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        button.main-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        button.main-btn:hover {
            background: #1d4ed8;
        }
        
        .social-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0 8px;
            color: #9ca3af;
            font-size: 14px;
            font-weight: bold;
        }

        .social-divider::before,
        .social-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #374151;
        }

        .social {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        
        .social-btn {
            flex: 1;
            margin: 0 3px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        
        .social-btn:hover {
            opacity: 0.9;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .social-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .google-btn {
            background: #ffffff !important;
            color: #202124 !important;
            border: 1px solid #dadce0 !important;
        }

        .facebook-btn {
            background: #1877f2 !important;
        }

        .phone-btn {
            background: #22c55e !important;
        }
        
        .error-msg {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
<div class="logo-box">
    <img src="https://k.top4top.io/p_3886rtzn71.png" alt="شعار X Plus">
</div>

<p class="welcome-text" style="display:none;">مرحباً بك في موقع X Plus</p>

        <!-- Inputs -->
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">

        <!-- Links -->
        <p class="link" onclick="forgotPassword()">نسيت كلمة المرور؟</p>

        <!-- Button -->
        <button class="main-btn" onclick="login()">تسجيل الدخول</button>

        <!-- Register -->
        <p class="link" id="registerLink" onclick="register()">إنشاء حساب جديد</p>

        <!-- Social -->
        <div class="social-divider" id="socialDivider">
    <span>متابعة</span>
</div>
        <div class="social" id="socialButtons">
            <button class="social-btn google-btn" onclick="socialLogin('google')">
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M21.35 12.27c0-.72-.06-1.42-.18-2.09H12v3.96h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.26z"/>
                    <path fill="#34A853" d="M12 21.72c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.72z"/>
                    <path fill="#FBBC05" d="M6.54 13.8A5.85 5.85 0 0 1 6.23 12c0-.62.11-1.22.31-1.8V7.67H3.3A9.74 9.74 0 0 0 2.27 12c0 1.57.38 3.06 1.03 4.33l3.24-2.53z"/>
                    <path fill="#EA4335" d="M12 6.17c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.83 3.27 14.63 2.28 12 2.28a9.74 9.74 0 0 0-8.7 5.39l3.24 2.53C7.31 7.89 9.46 6.17 12 6.17z"/>
                </svg>
                Google
            </button>

            <button class="social-btn facebook-btn" onclick="socialLogin('facebook')">
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="white" d="M13.5 21v-8h2.75l.42-3h-3.17V8.08c0-.87.24-1.46 1.49-1.46h1.6V3.94c-.28-.04-1.24-.12-2.36-.12-2.34 0-3.94 1.43-3.94 4.05V10H7.65v3h2.64v8h3.21z"/>
                </svg>
                Facebook
            </button>

            <button class="social-btn phone-btn" onclick="phoneVerification()">
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="white" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C11.72 21 3 12.28 3 2.99 3 2.44 3.45 2 4 2h3.5c.55 0 1 .44 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
                Phone
            </button>
        </div>

        <p class="error-msg" id="errorMsg"></p>
    </div>

  <script>
const emailInput = document.getElementById("email");
const loginEmail = new URLSearchParams(window.location.search).get("email");

if (loginEmail) {
    emailInput.value = loginEmail;
}

// ============================================
// التحقق من اكتمال التسجيل الداخلي
// ============================================
function checkRegistrationStatus() {

    const registrationCompleted =
        localStorage.getItem("registrationCompleted") === "true";

    if (!registrationCompleted) {
        return;
    }

    console.log("🔒 POST-REGISTRATION MODE");

    // العناصر التي يجب إخفاؤها نهائياً بعد اكتمال التسجيل
    const elementsToHide = [
        document.getElementById("registerLink"),
        document.getElementById("socialDivider"),
        document.getElementById("socialButtons")
    ];

    elementsToHide.forEach((el) => {
        if (el) {
            el.hidden = true;
            el.style.setProperty("display", "none", "important");
            el.style.setProperty("visibility", "hidden", "important");
        }
    });

    // الشعار يبقى ظاهراً
    const logo = document.querySelector(".logo-box");
    if (logo) {
        logo.hidden = false;
        logo.style.setProperty("display", "block", "important");
        logo.style.setProperty("visibility", "visible", "important");
    }

    // الترحيب يظهر تحت الشعار
    const welcome = document.querySelector(".welcome-text");
    if (welcome) {
        welcome.textContent =
            "تم إنشاء حسابك بنجاح، يرجى تسجيل الدخول";
        welcome.hidden = false;
        welcome.style.setProperty("display", "block", "important");
        welcome.style.setProperty("visibility", "visible", "important");
    }

    // حقول الدخول تبقى ظاهرة وفارغة
    const email = document.getElementById("email");
    const password = document.getElementById("password");

    if (email) {
        email.value = "";
        email.style.setProperty("display", "block", "important");
        email.style.setProperty("visibility", "visible", "important");
    }

    if (password) {
        password.value = "";
        password.style.setProperty("display", "block", "important");
        password.style.setProperty("visibility", "visible", "important");
    }

    console.log("✅ واجهة ما بعد التسجيل مفعلة");
    console.log("❌ إنشاء حساب / متابعة / Google / Facebook / Phone مخفية");
}

document.addEventListener("DOMContentLoaded", checkRegistrationStatus);
window.addEventListener("load", checkRegistrationStatus);

async function login() {

    const email = emailInput.value.trim();
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.textContent = "";

    if (!email || !password) {
        errorMsg.textContent = "يرجى ملء الحقول";
        return;
    }

    try {

        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email,
                password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            errorMsg.textContent = data.message || "فشل تسجيل الدخول";
            return;
        }

localStorage.setItem("token", data.token);
localStorage.removeItem("auth_token");

window.location.href = "/dashboard/home.html";

    } catch (error) {

        console.error(error);
        errorMsg.textContent = "تعذر الاتصال بالخادم";

    }

}

function forgotPassword() {
    window.location.href = "/forgot-password";
}

function register() {
    window.location.href = "/register.html";
}

function socialLogin(provider) {
    window.location.href = "/" + provider + "-login";
}

function phoneVerification() {
    window.location.href = "/phone";
}
</script>
</body>
</html>
