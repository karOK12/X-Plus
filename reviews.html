<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المراجعات - X Plus</title>

<style>
body{
margin:0;
padding:20px;
font-family:Cairo,Arial,sans-serif;
background:#06101d;
color:#fff;
}

.container{
position:relative;
max-width:720px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:20px;
}

.review{
padding:18px 0;
border-bottom:none;
}

.review-head{
display:flex;
align-items:flex-start;
}

.user-row{
display:flex;
align-items:flex-start;
gap:10px;
width:100%;
}

.avatar{
width:44px;
height:44px;
min-width:44px;
border-radius:50%;
object-fit:cover;
display:block;
background:#172536;
border:1px solid rgba(255,255,255,.12);
}

.user-info{
display:flex;
flex-direction:column;
align-items:flex-start;
min-width:0;
}

.username{
font-weight:800;
font-size:15px;
line-height:1.4;
color:#fff;
}

.rating-date{
display:flex;
align-items:center;
gap:9px;
margin-top:4px;
direction:ltr;
}

.stars{
color:#ffd43b;
direction:ltr;
margin:0;
letter-spacing:1px;
line-height:1;
font-size:15px;
}

.date{
color:#8193a8;
font-size:12px;
line-height:1;
direction:ltr;
}

.comment-row{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:12px;
margin-top:5px;
}

.comment{
margin:0;
padding-right:54px;
line-height:1.9;
color:#d9e3ed;
white-space:pre-wrap;
flex:1;
}

.review-actions{
display:flex;
align-items:center;
gap:5px;
direction:rtl;
flex-shrink:0;
}

.review-action{
border:1px solid rgba(255,255,255,.12);
background:#101d2c;
color:#9fb0c3;
border-radius:6px;
min-width:38px;
height:30px;
padding:0 7px;
font-family:inherit;
font-size:12px;
cursor:pointer;
}

.review-action:hover{
background:#17283b;
color:#fff;
}

.review-action.active{
background:#1d3550;
color:#fff;
border-color:rgba(255,255,255,.2);
}


.review-card{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:12px;
width:100%;
}

.review-main{
flex:1;
min-width:0;
}

.review-side{
width:62px;
min-width:62px;
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
}

.more-button{
border:0;
background:transparent;
color:#9fb0c3;
font-size:25px;
line-height:25px;
padding:0;
cursor:pointer;
font-family:Arial,sans-serif;
}

.more-button:hover{
color:#fff;
}

.review-side .review-actions{
display:flex;
align-items:center;
gap:4px;
direction:rtl;
}

.review-side .review-action{
min-width:28px;
height:27px;
padding:0 6px;
font-size:11px;
}

.report-menu{
display:none;
position:absolute;
z-index:30;
top:28px;
right:0;
background:#101d2c;
border:1px solid rgba(255,255,255,.12);
border-radius:8px;
padding:5px;
box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.report-menu.show{
display:block;
}

.report-option{
display:block;
width:150px;
border:0;
background:transparent;
color:#d9e3ed;
padding:8px 10px;
border-radius:6px;
font-family:inherit;
font-size:12px;
text-align:right;
cursor:pointer;
}

.report-option:hover{
background:#17283b;
color:#fff;
}

.empty{
text-align:center;
color:#8fa1b5;
padding:30px;
}

.back{
display:flex;
align-items:center;
justify-content:flex-start;
width:max-content;
margin:0;
position:fixed;
top:-20px;
right:-8px;
padding:8px 12px;
min-height:44px;
gap:8px;
color:#91acd0;
text-decoration:none;
font-size:14px;
font-weight:800;
}

.back-icon{
font-size:32px;
font-weight:400;
line-height:1;
display:inline-flex;
align-items:center;
justify-content:center;
transform:translateY(-1px);
}

@media(max-width:480px){
body{
padding:16px;
}

.avatar{
width:42px;
height:42px;
min-width:42px;
}

.username{
font-size:15px;
}

.stars{
font-size:14px;
}

.comment{
padding-right:52px;
}
}
</style>
</head>

<body>

<div class="container">

<a class="back" href="rating.html">
<span class="back-icon">‹</span>
</a>

<div id="writeReview" style="display:none;">

<h1 style="margin-bottom:10px;">كتابة مراجعة</h1>

<div id="selectedStars" class="stars" style="text-align:center;font-size:28px;letter-spacing:3px;margin:18px 0;"></div>

<label for="reviewComment" style="display:block;margin-bottom:8px;color:#9fb0c3;font-size:14px;">
صف تجربتك (اختياري)
</label>

<textarea
id="reviewComment"
maxlength="500"
placeholder="اكتب رأيك أو تجربتك في X Plus..."
style="width:100%;min-height:140px;box-sizing:border-box;background:#0d1a29;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px;font-family:inherit;font-size:15px;resize:vertical;outline:none;"
></textarea>

<div style="display:flex;justify-content:flex-start;margin-top:14px;">
<button
id="publishReview"
type="button"
style="border:0;border-radius:10px;background:#1677ff;color:#fff;padding:10px 22px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;"
>
نشر
</button>
</div>

<div id="writeMessage" class="empty" style="padding:16px 0;"></div>

</div>

<div id="reviewList">

<h1 id="reviewsTitle">مراجعات X Plus</h1>

<div id="reviews">
<div class="empty">جاري تحميل المراجعات...</div>
</div>

</div>

</div>

<script>

const API_URL="/api";

const params=new URLSearchParams(window.location.search);
const selectedRating=Number(params.get("rating"));

const writeReview=document.getElementById("writeReview");
const reviewList=document.getElementById("reviewList");
const selectedStars=document.getElementById("selectedStars");
const reviewComment=document.getElementById("reviewComment");
const publishReview=document.getElementById("publishReview");
const writeMessage=document.getElementById("writeMessage");

const isWritingReview=
Number.isInteger(selectedRating) &&
selectedRating >= 1 &&
selectedRating <= 5;

if(isWritingReview){

writeReview.style.display="block";
reviewList.style.display="none";

selectedStars.textContent=
"★".repeat(selectedRating)+
"☆".repeat(5-selectedRating);

}

function getToken(){
return localStorage.getItem("token") ||
localStorage.getItem("auth_token");
}

function apiFetch(url,options={}){
const token=getToken();

return fetch(url,{
...options,
headers:{
"Content-Type":"application/json",
...(token ? {Authorization:`Bearer ${token}`} : {}),
...(options.headers || {})
}
});
}

function escapeHtml(value){
return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function formatDate(value){

if(!value) return "";

try{

const date=new Date(value);

if(Number.isNaN(date.getTime())){
return "";
}

return `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()}`;

}catch{
return "";
}
}

function renderStars(rating){

let value=Number(rating);

if(!Number.isFinite(value)){
value=0;
}

value=Math.max(0,Math.min(5,Math.round(value)));

return `
<div class="stars">
${"★".repeat(value)}${"☆".repeat(5-value)}
</div>
`;
}

function getAvatar(review){

return review.avatar ||
review.avatarUrl ||
review.profileImage ||
review.profile_image ||
review.photo ||
review.image ||
review.userAvatar ||
(review.user && (
review.user.avatar ||
review.user.avatarUrl ||
review.user.profileImage ||
review.user.profile_image ||
review.user.photo ||
review.user.image
)) ||
"";
}

function getUsername(review){

return review.username ||
review.userName ||
review.name ||
(review.user && (
review.user.username ||
review.user.userName ||
review.user.name
)) ||
"مستخدم";
}

function getReviewDate(review){

return review.createdAt ||
review.created_at ||
review.date ||
review.created ||
(review.user && (
review.user.createdAt ||
review.user.created_at
)) ||
"";
}


async function publishSelectedReview(){

if(!isWritingReview){
return;
}

const text=reviewComment.value.trim();

if(text.length>500){
writeMessage.textContent="⚠️ المراجعة يجب ألا تتجاوز 500 حرف.";
return;
}

publishReview.disabled=true;
writeMessage.textContent="⏳ جاري نشر المراجعة...";

try{

const res=await apiFetch(`${API_URL}/rating`,{
method:"POST",
body:JSON.stringify({
rating:selectedRating,
comment:text || null
})
});

const data=await res.json();

if(!res.ok || !data.success){
throw new Error(data.message || "تعذر نشر المراجعة");
}

window.location.href="rating.html";

}catch(error){

console.error(error);

writeMessage.textContent=
error.message || "تعذر نشر المراجعة حاليًا.";

publishReview.disabled=false;

}

}

publishReview.addEventListener("click",publishSelectedReview);


async function loadReviews(){

const container=document.getElementById("reviews");

try{

const res=await apiFetch(`${API_URL}/rating`);
const data=await res.json();

if(!res.ok || !data.success){
throw new Error(data.message || "تعذر تحميل المراجعات");
}

const items=data.reviews || [];

if(!items.length){

container.innerHTML=
`<div class="empty">لا توجد مراجعات بعد.</div>`;

return;
}

container.innerHTML=items.map(review=>{

const avatar=getAvatar(review);
const username=getUsername(review);
const reviewId=review.id || review._id || "";

return `
<article class="review">

<div class="review-card">

<div class="review-main">

<div class="review-head">

<div class="user-row">

${
avatar
? `
<img
class="avatar"
src="${escapeHtml(avatar)}"
alt="صورة بروفايل ${escapeHtml(username)}"
>
`
: `
<div class="avatar"></div>
`
}

<div class="user-info">

<div class="username">
${escapeHtml(username)}
</div>

<div class="rating-date">

${renderStars(review.rating)}

<div class="date">
${formatDate(getReviewDate(review))}
</div>

</div>

</div>

</div>

</div>

<div class="comment-row">

<div class="comment">
${escapeHtml(review.comment || "")}
</div>

</div>

</div>

<div class="review-side">

<div style="position:relative;">

<button
class="more-button"
type="button"
title="خيارات المراجعة"
data-menu-id="${escapeHtml(reviewId)}"
>
⋮
</button>

<div
class="report-menu"
data-report-menu="${escapeHtml(reviewId)}"
>

<button
class="report-option"
type="button"
data-review-id="${escapeHtml(reviewId)}"
data-report-reason="محتوى غير ملائم"
>
محتوى غير ملائم
</button>

<button
class="report-option"
type="button"
data-review-id="${escapeHtml(reviewId)}"
data-report-reason="غير مرغوب فيه"
>
غير مرغوب فيه
</button>

</div>

</div>

<div class="review-actions">

<button
class="review-action"
type="button"
data-review-id="${escapeHtml(reviewId)}"
data-vote="no"
>
لا
</button>

<button
class="review-action"
type="button"
data-review-id="${escapeHtml(reviewId)}"
data-vote="yes"
>
نعم
</button>

</div>

</div>

</div>

</article>
`;

}).join("");

}catch(error){

console.error(error);

container.innerHTML=
`<div class="empty">تعذر تحميل المراجعات حاليًا.</div>`;

}

}

document.addEventListener("click",function(e){

const moreButton=e.target.closest(".more-button");

if(moreButton){

const id=moreButton.dataset.menuId;
const menu=document.querySelector(
`[data-report-menu="${CSS.escape(id)}"]`
);

document.querySelectorAll(".report-menu.show").forEach(item=>{
if(item!==menu){
item.classList.remove("show");
}
});

if(menu){
menu.classList.toggle("show");
}

return;
}

const reportButton=e.target.closest(".report-option");

if(reportButton){

const reason=reportButton.dataset.reportReason;
const reviewId=reportButton.dataset.reviewId;

document.querySelectorAll(".report-menu.show").forEach(item=>{
item.classList.remove("show");
});

alert(`تم اختيار الإبلاغ عن المراجعة بسبب: ${reason}`);

console.log("Report review:",{
reviewId,
reason
});

return;
}

const button=e.target.closest(".review-action");

if(button){

const row=button.parentElement;

row.querySelectorAll(".review-action").forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

return;
}

if(!e.target.closest(".report-menu")){

document.querySelectorAll(".report-menu.show").forEach(item=>{
item.classList.remove("show");
});

}

});

loadReviews();

</script>

</body>
</html>
