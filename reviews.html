<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المراجعات - X Plus</title>

<style>
body{
margin:0;
padding:20px;
font-family:Cairo,Arial,sans-serif;
background:#06101d;
color:#fff;
}

.container{
position:relative;
max-width:720px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:20px;
}

.review{
padding:18px 0;
border-bottom:none;
}

.review-head{
display:flex;
align-items:flex-start;
}

.user-row{
display:flex;
align-items:flex-start;
gap:10px;
width:100%;
}

.avatar{
width:44px;
height:44px;
min-width:44px;
border-radius:50%;
object-fit:cover;
display:block;
background:#172536;
border:1px solid rgba(255,255,255,.12);
}

.user-info{
display:flex;
flex-direction:column;
align-items:flex-start;
min-width:0;
}

.username{
font-weight:800;
font-size:15px;
line-height:1.4;
color:#fff;
}

.rating-date{
display:flex;
align-items:center;
gap:9px;
margin-top:4px;
direction:ltr;
}

.stars{
color:#ffd43b;
direction:ltr;
margin:0;
letter-spacing:1px;
line-height:1;
font-size:15px;
}

.date{
color:#8193a8;
font-size:12px;
line-height:1;
direction:ltr;
}

.comment-row{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:12px;
margin-top:5px;
}

.comment{
margin:0;
padding-right:54px;
line-height:1.9;
color:#d9e3ed;
white-space:pre-wrap;
flex:1;
}

.review-actions{
display:flex;
align-items:center;
gap:5px;
direction:rtl;
flex-shrink:0;
}

.review-action{
border:1px solid rgba(255,255,255,.12);
background:#101d2c;
color:#9fb0c3;
border-radius:6px;
min-width:38px;
height:30px;
padding:0 7px;
font-family:inherit;
font-size:12px;
cursor:pointer;
}

.review-action:hover{
background:#17283b;
color:#fff;
}

.review-action.active{
background:#1d3550;
color:#fff;
border-color:rgba(255,255,255,.2);
}

.empty{
text-align:center;
color:#8fa1b5;
padding:30px;
}

.back{
display:flex;
align-items:center;
justify-content:flex-start;
width:max-content;
margin:0;
position:fixed;
top:-20px;
right:-8px;
padding:8px 12px;
min-height:44px;
gap:8px;
color:#91acd0;
text-decoration:none;
font-size:14px;
font-weight:800;
}

.back-icon{
font-size:32px;
font-weight:400;
line-height:1;
display:inline-flex;
align-items:center;
justify-content:center;
transform:translateY(-1px);
}

@media(max-width:480px){
body{
padding:16px;
}

.avatar{
width:42px;
height:42px;
min-width:42px;
}

.username{
font-size:15px;
}

.stars{
font-size:14px;
}

.comment{
padding-right:52px;
}
}
</style>
</head>

<body>

<div class="container">

<a class="back" href="rating.html">
<span class="back-icon">‹</span>
</a>

<h1>مراجعات X Plus</h1>

<div id="reviews">
<div class="empty">جاري تحميل المراجعات...</div>
</div>

</div>

<script>

const API_URL="/api";

function getToken(){
return localStorage.getItem("token") ||
localStorage.getItem("auth_token");
}

function apiFetch(url,options={}){
const token=getToken();

return fetch(url,{
...options,
headers:{
"Content-Type":"application/json",
...(token ? {Authorization:`Bearer ${token}`} : {}),
...(options.headers || {})
}
});
}

function escapeHtml(value){
return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function formatDate(value){

if(!value) return "";

try{

const date=new Date(value);

if(Number.isNaN(date.getTime())){
return "";
}

return `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()}`;

}catch{
return "";
}
}

function renderStars(rating){

let value=Number(rating);

if(!Number.isFinite(value)){
value=0;
}

value=Math.max(0,Math.min(5,Math.round(value)));

return `
<div class="stars">
${"★".repeat(value)}${"☆".repeat(5-value)}
</div>
`;
}

function getAvatar(review){

return review.avatar ||
review.avatarUrl ||
review.profileImage ||
review.profile_image ||
review.photo ||
review.image ||
review.userAvatar ||
(review.user && (
review.user.avatar ||
review.user.avatarUrl ||
review.user.profileImage ||
review.user.profile_image ||
review.user.photo ||
review.user.image
)) ||
"";
}

function getUsername(review){

return review.username ||
review.userName ||
review.name ||
(review.user && (
review.user.username ||
review.user.userName ||
review.user.name
)) ||
"مستخدم";
}

function getReviewDate(review){

return review.createdAt ||
review.created_at ||
review.date ||
review.created ||
(review.user && (
review.user.createdAt ||
review.user.created_at
)) ||
"";
}


async function loadReviews(){

const container=document.getElementById("reviews");

try{

const res=await apiFetch(`${API_URL}/rating`);
const data=await res.json();

if(!res.ok || !data.success){
throw new Error(data.message || "تعذر تحميل المراجعات");
}

const items=data.reviews || [];

if(!items.length){

container.innerHTML=
`<div class="empty">لا توجد مراجعات بعد.</div>`;

return;
}

container.innerHTML=items.map(review=>{

const avatar=getAvatar(review);
const username=getUsername(review);
const reviewId=review.id || review._id || "";

return `

<article class="review">

<div class="review-head">

<div class="user-row">

${
avatar
? `
<img
class="avatar"
src="${escapeHtml(avatar)}"
alt="صورة بروفايل ${escapeHtml(username)}"
>
`
: `
<div class="avatar"></div>
`
}

<div class="user-info">

<div class="username">
${escapeHtml(username)}
</div>

<div class="rating-date">

${renderStars(review.rating)}

<div class="date">
${formatDate(getReviewDate(review))}
</div>

</div>

</div>

</div>

</div>

<div class="comment-row">

<div class="comment">
${escapeHtml(review.comment || "")}
</div>

<div class="review-actions">

<button
class="review-action"
type="button"
data-review-id="${escapeHtml(reviewId)}"
data-vote="no"
>
لا
</button>

<button
class="review-action"
type="button"
data-review-id="${escapeHtml(reviewId)}"
data-vote="yes"
>
نعم
</button>

</div>

</div>

</article>

`;

}).join("");

}catch(error){

console.error(error);

container.innerHTML=
`<div class="empty">تعذر تحميل المراجعات حاليًا.</div>`;

}

}


document.addEventListener("click",function(e){

const button=e.target.closest(".review-action");

if(!button)return;

const row=button.parentElement;

row.querySelectorAll(".review-action").forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

});

loadReviews();

</script>

</body>
</html>
