<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أمان المحفظة | X Plus</title>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Changa:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0B0E11;
      --card:#1E2329;
      --line:#2B3139;
      --text:#EAECEF;
      --muted:#848E9C;
      --yellow:#FCD535;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:'Almarai',sans-serif;
    }
    header {
      display:flex;
      align-items:center;
      gap:14px;
      padding:18px 16px;
      border-bottom:1px solid var(--line);
      background:#181A20;
    }

    .back {
      width:40px;
      height:40px;
      flex:0 0 40px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      background:linear-gradient(145deg,var(--card),var(--card2));
      color:var(--yellow);
      box-shadow:0 3px 12px rgba(0,0,0,.16);
      cursor:pointer;
    }
    .back svg {
      width:20px;
      height:20px;
    }
    .back:hover {
      border-color:var(--yellow);
      background:var(--card2);
      color:var(--yellow);
      transform:translateY(-1px);
    }
    .back:focus-visible {
      outline:2px solid var(--yellow);
      outline-offset:3px;
    }

    h1 {
      margin:0;
      font-family:'Changa',sans-serif;
      font-size:19px;
      font-weight:700;
    }
    main {
      width:min(100% - 28px,650px);
      margin:22px auto;
    }
    .card {
      padding:20px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--card);
      min-height:150px;
    }
    .heading {
      margin:0 0 10px;
      color:var(--yellow);
      font-family:'Changa',sans-serif;
      font-size:18px;
    }
    p {
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.9;
    }
  </style>
</head>
<body>
  <header>
    <button class="back" type="button" aria-label="رجوع"
      onclick="walletGoBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><path d="M3 12h11m-4-4 4 4-4 4"/></svg></button>
    <h1>أمان المحفظة</h1>
  </header>
  <main>
    <section class="card">
      <h2 class="heading">أمان المحفظة</h2>
      <p>إعدادات ومعلومات أمان محفظتك.</p>
      <p style="margin-top:14px">سيتم إضافة محتوى هذا القسم لاحقاً.</p>
    </section>
  </main>

<script>
function walletGoBack() {
  location.replace('/wallet.html?view=account');
}
</script>

</body>
</html>
