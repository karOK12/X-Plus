<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المهام والعروض - X Plus</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f8fafc;font-family:Arial,Tahoma,sans-serif}
header{padding:18px 16px;background:#111827;border-bottom:1px solid #273244}
.wrap{width:min(100% - 28px,1000px);margin:auto}
header a{color:#93c5fd;text-decoration:none}
main{padding:28px 0}
.section-header{text-align:center;margin-bottom:24px}
.section-badge{color:#93c5fd;margin-bottom:12px}
.section-title{font-size:clamp(24px,5vw,34px);margin:0 0 12px}
.section-description{color:#94a3b8;line-height:1.8}
    .offerwall-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    .offerwall-card {
      background: #111827;
      border: 1px solid #273244;
      border-radius: 16px;
      padding: 20px;
      text-align: right;
      overflow-wrap: anywhere;
    }
    .offerwall-card h3 {
      color: #f8fafc;
      margin: 0 0 12px;
      font-size: 18px;
    }
    .offerwall-requirements {
      color: #cbd5e1;
      line-height: 1.7;
      margin: 0 0 14px;
      white-space: pre-wrap;
    }
    .offerwall-reward {
      color: #60a5fa;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .offerwall-open, .offerwall-reload {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    .offerwall-status {
      color: #cbd5e1;
      text-align: center;
      padding: 18px;
      line-height: 1.8;
    }


</style>
</head>
<body>
<header><div class="wrap"><a href="home.html">← الرجوع إلى لوحة التحكم</a></div></header>
<main class="wrap">
  <section id="offerwallTasks" class="section">
    <div class="container">
      <div class="section-header">
        <div class="section-badge">🎯 اكسب النقاط</div>
        <h2 class="section-title">المهام والعروض</h2>
        <p style="color:#94a3b8; margin-top:12px;">
          أكمل شروط المهمة حتى تُحتسب المكافأة بعد تأكيد مزوّد العروض.
        </p>
      </div>
      <div id="offerwallStatus" class="offerwall-status"
           role="status" aria-live="polite">جارٍ تحميل العروض...</div>
      <div id="offerwallList" class="offerwall-grid"></div>
      <div style="text-align:center; margin-top:22px;">
        <button type="button" class="offerwall-reload" id="offerwallReload">
          🔄 تحديث العروض
        </button>
      </div>
    </div>
  </section>

</main>
<script>
const API_URL = window.location.hostname === 'localhost'
  ? 'http://localhost:3000/api'
  : '/api';

    async function apiFetch(url, options = {}) {
      const token = localStorage.getItem('token') || localStorage.getItem('auth_token');
      const headers = { 'Content-Type': 'application/json', ...options.headers };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const response = await fetch(url, { ...options, headers });
      if (response.status === 401) {
        localStorage.removeItem('token');
        localStorage.removeItem('auth_token');
        if (window.location.pathname !== '/login.html') window.location.href = 'login.html';
        throw new Error('انتهت صلاحية الجلسة');
      }
      if (!response.ok) {
        const error = await response.json().catch(() => ({ message: 'خطأ في الخادم' }));
        throw new Error(error.message || `HTTP ${response.status}`);
      }
      return response;
    }




    async function loadOfferwallOffers() {
      const status = document.getElementById('offerwallStatus');
      const list = document.getElementById('offerwallList');
      const reload = document.getElementById('offerwallReload');

      if (!status || !list || !reload) return;

      reload.disabled = true;
      status.textContent = 'جارٍ تحميل العروض...';
      list.replaceChildren();

      try {
        const response = await apiFetch(`${API_URL}/offerwall/offers`);
        const result = await response.json();
        const offers = result?.data?.offers;

        if (!result?.success || !Array.isArray(offers)) {
          throw new Error('استجابة العروض غير صالحة');
        }

        if (offers.length === 0) {
          status.textContent = 'ماكو عروض متاحة حالياً. جرّب التحديث لاحقاً.';
          return;
        }

        status.textContent = `العروض المتاحة: ${offers.length}`;

        for (const offer of offers) {
          const card = document.createElement('article');
          card.className = 'offerwall-card';

          const title = document.createElement('h3');
          title.textContent = String(offer.name || 'مهمة');

          const requirements = document.createElement('p');
          requirements.className = 'offerwall-requirements';
          requirements.textContent = String(
            offer.requirements || 'راجع شروط المهمة داخل صفحة العرض.'
          );

          const reward = document.createElement('div');
          reward.className = 'offerwall-reward';
          reward.textContent = '🎁 المكافأة: ' + String(
            offer.rewardFormatted || offer.reward || 'حسب العرض'
          );

          card.append(title, requirements, reward);

          let safeUrl = null;
          try {
            const url = new URL(offer.clickUrl);
            if (url.protocol === 'https:' &&
                url.hostname === 'offerwall.gg') {
              safeUrl = url.href;
            }
          } catch (_) {}

          if (safeUrl) {
            const open = document.createElement('button');
            open.type = 'button';
            open.className = 'offerwall-open';
            open.textContent = 'عرض المهمة';
            open.addEventListener('click', () => {
              window.open(safeUrl, '_blank', 'noopener,noreferrer');
            });
            card.append(open);
          }

          list.append(card);
        }
      } catch (error) {
        status.textContent = 'تعذر تحميل العروض. ' +
          'تحقق من تسجيل الدخول وإعدادات خدمة Offerwall.GG.';
        console.error('Offerwall load failed:', error.message);
      } finally {
        reload.disabled = false;
      }
    }

    document.getElementById('offerwallReload')?.addEventListener(
      'click', loadOfferwallOffers
    );
    loadOfferwallOffers();
</script>
</body>
</html>
