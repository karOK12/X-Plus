<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التحقق من الحساب</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #e9eef5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      text-align: center;
    }

    h2 {
      margin: 0 0 10px;
      color: #1a2b4a;
      font-size: 21px;
    }

    .info {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.8;
    }

    .timer {
      margin: 10px 0 15px;
      font-size: 13px;
      color: #1877f2;
      font-weight: 700;
    }

    .timer.expired {
      color: #c33;
    }

    .resend {
      margin-top: 10px;
      background: #28a745;
    }

    .resend:disabled {
      opacity: .6;
    }

    .otp-inputs {
      display: flex;
      direction: ltr;
      justify-content: center;
      gap: 7px;
      margin: 20px 0;
    }

    .otp-box {
      width: 45px;
      height: 50px;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      outline: none;
    }

    .otp-box:focus {
      border-color: #1877f2;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 10px;
      background: #1877f2;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .alert {
      display: none;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 7px;
      font-size: 12px;
    }

    .alert.show {
      display: block;
    }

    .alert.error {
      background: #fee;
      color: #c33;
    }

    .alert.success {
      background: #efe;
      color: #287a35;
    }

    .back {
      margin-top: 12px;
      background: #6c757d;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>🔐 التحقق من الحساب</h2>

  <div class="info" id="verifyInfo">
    أدخل رمز التحقق المرسل إليك
  </div>

  <div class="timer" id="otpTimer">
    ⏱️ صلاحية الكود: 10:00
  </div>

  <div class="alert" id="alert"></div>

  <div class="otp-inputs">
    <input class="otp-box" maxlength="1" inputmode="numeric">
    <input class="otp-box" maxlength="1" inputmode="numeric">
    <input class="otp-box" maxlength="1" inputmode="numeric">
    <input class="otp-box" maxlength="1" inputmode="numeric">
    <input class="otp-box" maxlength="1" inputmode="numeric">
    <input class="otp-box" maxlength="1" inputmode="numeric">
  </div>

  <button id="verifyBtn" onclick="verifyOTP()">
    تأكيد الكود
  </button>

  <button
    id="resendBtn"
    class="resend"
    onclick="resendOTP()"
    disabled
  >
    إعادة إرسال الكود
  </button>

  <button class="back" onclick="goBack()">
    رجوع
  </button>

</div>

<script>

const API_URL = '/api';

const boxes = document.querySelectorAll('.otp-box');

const alertBox = document.getElementById('alert');
const verifyBtn = document.getElementById('verifyBtn');
const resendBtn = document.getElementById('resendBtn');
const otpTimer = document.getElementById('otpTimer');

let timerInterval = null;
let remainingSeconds = 10 * 60;

function showAlert(message, type) {
  alertBox.textContent = message;
  alertBox.className = 'alert show ' + type;
}

function getOTP() {
  return Array.from(boxes)
    .map(box => box.value)
    .join('');
}

boxes.forEach((box, index) => {

  box.addEventListener('input', function () {

    this.value = this.value.replace(/[^0-9]/g, '');

    if (this.value && index < boxes.length - 1) {
      boxes[index + 1].focus();
    }

  });

  box.addEventListener('keydown', function(e) {

    if (
      e.key === 'Backspace' &&
      !this.value &&
      index > 0
    ) {
      boxes[index - 1].focus();
    }

  });

});

function updateTimer() {
  const minutes = Math.floor(remainingSeconds / 60);
  const seconds = remainingSeconds % 60;

  otpTimer.textContent =
    `⏱️ صلاحية الكود: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

  if (remainingSeconds <= 0) {
    clearInterval(timerInterval);
    timerInterval = null;

    otpTimer.textContent = '⛔ انتهت صلاحية الكود';
    otpTimer.classList.add('expired');

    verifyBtn.disabled = true;
    resendBtn.disabled = false;

    showAlert(
      'انتهت صلاحية رمز التحقق. يمكنك طلب رمز جديد.',
      'error'
    );

    return;
  }

  remainingSeconds--;
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }

  remainingSeconds = 10 * 60;
  otpTimer.classList.remove('expired');

  verifyBtn.disabled = false;
  resendBtn.disabled = true;

  updateTimer();

  timerInterval = setInterval(updateTimer, 1000);
}

async function resendOTP() {
  const pending = JSON.parse(
    sessionStorage.getItem('pendingVerification') || 'null'
  );

  if (!pending || !pending.email) {
    showAlert(
      'بيانات التحقق غير موجودة، ارجع وأرسل الكود من جديد',
      'error'
    );
    return;
  }

  resendBtn.disabled = true;
  resendBtn.textContent = 'جاري إرسال الكود...';

  try {
    const token =
      localStorage.getItem('token') ||
      localStorage.getItem('auth_token');

    const headers = {
      'Content-Type': 'application/json'
    };

    if (token) {
      headers.Authorization = `Bearer ${token}`;
    }

    const response = await fetch(`${API_URL}/otp/resend`, {
      method: 'POST',
      headers,
      body: JSON.stringify({
        email: pending.email
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || !data.success) {
      throw new Error(
        data.message || 'فشل إعادة إرسال الكود'
      );
    }

    showAlert(
      '✓ تم إرسال رمز تحقق جديد إلى بريدك',
      'success'
    );

    boxes.forEach(box => {
      box.value = '';
    });

    boxes[0].focus();

    startTimer();

  } catch (error) {

    console.error('Resend OTP error:', error);

    showAlert(
      '✗ ' + (error.message || 'فشل إعادة إرسال الكود'),
      'error'
    );

    resendBtn.disabled = false;

  } finally {

    resendBtn.textContent = 'إعادة إرسال الكود';

  }
}

async function verifyOTP() {

  const code = getOTP();

  if (code.length !== 6) {
    showAlert('أدخل الكود كاملاً المكون من 6 أرقام', 'error');
    return;
  }

  const pending = JSON.parse(
    sessionStorage.getItem('pendingVerification') || 'null'
  );

  if (!pending || !pending.email) {
    showAlert('بيانات التحقق غير موجودة، ارجع وأرسل الكود من جديد', 'error');
    return;
  }

  verifyBtn.disabled = true;
  verifyBtn.textContent = 'جاري التحقق...';

  try {

    const token =
      localStorage.getItem('token') ||
      localStorage.getItem('auth_token');

    const headers = {
      'Content-Type': 'application/json'
    };

    if (token) {
      headers.Authorization = `Bearer ${token}`;
    }

    const response = await fetch(`${API_URL}/otp/verify`, {
      method: 'POST',
      headers,
      body: JSON.stringify({
        email: pending.email,
        otp: code
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || !data.success) {
      throw new Error(
        data.message || 'رمز التحقق غير صحيح'
      );
    }

    // الحساب موجود مسبقاً: الانتقال إلى تسجيل الدخول
    if (data.accountExists) {
      sessionStorage.removeItem('pendingVerification');
      sessionStorage.removeItem('verifyFormData');
      sessionStorage.removeItem('otpVerified');

      showAlert('✓ تم التحقق من البريد. يرجى تسجيل الدخول.', 'success');

      setTimeout(() => {
        window.location.href =
          '/login-user.html';
      }, 700);

      return;
    }

    // حفظ جلسة المستخدم بعد نجاح التحقق
    if (data.token) {
      localStorage.setItem('token', data.token);
      localStorage.removeItem('auth_token');
    }

    sessionStorage.setItem('otpVerified', 'true');

    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    verifyBtn.disabled = true;
    resendBtn.disabled = true;

    showAlert('✓ تم التحقق بنجاح', 'success');

    setTimeout(() => {
      window.location.href = pending.returnUrl || '/user-data.html';
    }, 700);

  } catch (error) {

    console.error('Verify error:', error);

    showAlert(
      '✗ ' + (error.message || 'فشل التحقق'),
      'error'
    );

    verifyBtn.disabled = false;
    verifyBtn.textContent = 'تأكيد الكود';
  }
}

function goBack() {
  window.location.href = '/user-data.html';
}

const pending = JSON.parse(
  sessionStorage.getItem('pendingVerification') || 'null'
);

if (pending && pending.email) {

  document.getElementById('verifyInfo').textContent =
    `أدخل رمز التحقق المرسل إلى ${pending.email}`;

}

boxes[0].focus();

startTimer();

</script>

</body>
</html>
